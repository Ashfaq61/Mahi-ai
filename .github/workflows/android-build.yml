name: Mahi AI Android Build & Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with APK'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Mahi AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools cmdline-tools;latest'

      - name: Accept Android SDK Licenses Non-Interactively
        run: |
          echo "Accepting Android SDK licenses..."
          mkdir -p "$ANDROID_HOME/licenses"
          # Write known license hashes directly to prevent interactive license prompts
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo -e "\n7907f711f12b5094541804e42d46e30eb02b0461" > "$ANDROID_HOME/licenses/android-sdk-arm-dbt-license"
          echo -e "\n601085b94cd77f0b54ff86406957099fed7926e0" > "$ANDROID_HOME/licenses/google-gdk-license"
          echo -e "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > "$ANDROID_HOME/licenses/google-tv-license"
          # Run sdkmanager --licenses to auto-accept any remaining licenses
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || yes | sdkmanager --licenses || true

      - name: Install Android Platforms and Build-Tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools" || yes | sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools" || true

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Local Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew || true

      - name: Run Unit & Robolectric Tests
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Android Debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare & Verify Mahi AI APK
        id: verify_apk
        run: |
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          TARGET_APK="app/build/outputs/apk/debug/mahi-ai-debug.apk"
          
          if [ -f "$SOURCE_APK" ]; then
            cp "$SOURCE_APK" "$TARGET_APK"
            cp "$SOURCE_APK" "mahi-ai-debug.apk"
          else
            echo "ERROR: Source APK not found at $SOURCE_APK"
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: Generated APK is empty or missing!"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$TARGET_APK")
          echo "SUCCESS: $TARGET_APK generated successfully ($FILE_SIZE bytes)."
          echo "apk_size=$FILE_SIZE" >> $GITHUB_OUTPUT
          echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mahi-ai-debug-apk
          path: |
            mahi-ai-debug.apk
            app/build/outputs/apk/debug/mahi-ai-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          name: Mahi AI Voice Assistant v1.0 (${{ github.sha }})
          tag_name: v1.0.${{ github.run_number }}
          body: |
            ### 🎙️ Mahi AI Voice Assistant - Android APK Release

            **Build Details:**
            - **Commit:** `${{ github.sha }}`
            - **Workflow Run:** #${{ github.run_number }}
            - **Package ID:** `com.aistudio.mahiai.vzrtkp`
            - **Persona:** Sassy, Flirty, Witty AI Companion (Mahi)
            - **Status:** Verified Successful Build ✅

            **Download:**
            Download `mahi-ai-debug.apk` directly from the release assets below.
          files: |
            mahi-ai-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
