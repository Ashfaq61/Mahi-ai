name: Android CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.MAHI_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Grant Gradle Wrapper execute permission
        run: chmod +x ./gradlew

      - name: Run Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Decode Release Keystore (when secret configured)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          MAHI_KEYSTORE_BASE64: ${{ secrets.MAHI_KEYSTORE_BASE64 }}
        run: |
          echo "$MAHI_KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build Release APK
        env:
          MAHI_KEYSTORE_PATH: ${{ secrets.MAHI_KEYSTORE_BASE64 != '' && 'release.keystore' || '' }}
          MAHI_KEYSTORE_PASSWORD: ${{ secrets.MAHI_KEYSTORE_PASSWORD }}
          MAHI_KEY_ALIAS: ${{ secrets.MAHI_KEY_ALIAS }}
          MAHI_KEY_PASSWORD: ${{ secrets.MAHI_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --console=plain

      - name: Generate SHA-256 Checksums
        run: |
          sha256sum app/build/outputs/apk/debug/*.apk > debug-sha256.txt
          sha256sum app/build/outputs/apk/release/*.apk > release-sha256.txt

      - name: Upload Debug & Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: mahi-ai-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            debug-sha256.txt
            release-sha256.txt

      - name: Publish GitHub Release on Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            release-sha256.txt
          generate_release_notes: true
